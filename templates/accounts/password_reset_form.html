{% extends "base.html" %}
{% block title %}
    Recuperar senha | Bartender Base
{% endblock title %}
{% block content %}
    <section class="flex min-h-[75vh] items-center">
        <div class="mx-auto w-full max-w-md px-6 py-16">
            <div class="rounded-3xl border border-white/10 bg-zinc-900 p-8">
                <h1 class="text-3xl font-bold">Recuperar senha</h1>
                <p class="mt-3 text-sm leading-6 text-zinc-400">
                    Informe o e-mail cadastrado para receber o link de recuperação.
                </p>
                <form method="post" class="mt-8 space-y-5">
                    {% csrf_token %}
                    {% include "accounts/partials/form_fields.html" %}
                    <button type="submit"
                            class="w-full cursor-pointer rounded-xl bg-amber-500 px-6 py-3 font-semibold text-zinc-950 hover:bg-amber-400">
                        Enviar link
                    </button>
                </form>
            </div>
        </div>
    </section>
{% endblock content %}
