{% extends "base.html" %}
{% block title %}
    Editar conta | Bartender Base
{% endblock title %}
{% block content %}
    <section class="flex min-h-[75vh] items-center">
        <div class="mx-auto w-full max-w-md px-6 py-16">
            <div class="rounded-3xl border border-white/10 bg-zinc-900 p-8">
                <p class="font-medium text-amber-400">Minha conta</p>
                <h1 class="mt-2 text-3xl font-bold">Editar informações</h1>
                <form method="post" class="mt-8 space-y-5">
                    {% csrf_token %}
                    {% include "accounts/partials/form_fields.html" %}
                    <button type="submit"
                            class="w-full cursor-pointer rounded-xl bg-amber-500 px-6 py-3 font-semibold text-zinc-950 transition hover:bg-amber-400">
                        Salvar alterações
                    </button>
                </form>
                <div class="mt-6 flex justify-between gap-4 text-sm">
                    <a href="{% url 'accounts:profile' %}"
                       class="text-zinc-400 hover:text-amber-400">Cancelar</a>
                    <a href="{% url 'accounts:password-change' %}"
                       class="font-semibold text-amber-400">Alterar senha</a>
                </div>
            </div>
        </div>
    </section>
{% endblock content %}
